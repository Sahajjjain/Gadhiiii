<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Very Important Question 💖</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  /* Cuter pastel gradient */
  background: linear-gradient(180deg, #ffdde1 0%, #ee9ca7 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Fredoka', sans-serif;
  overflow: hidden;
}

/* Floating background hearts */
.bg-heart {
  position: absolute;
  color: rgba(255, 255, 255, 0.4);
  font-size: 2rem;
  animation: floatBackground 6s infinite ease-in-out;
  z-index: -1;
}

@keyframes floatBackground {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-20px) rotate(10deg); }
}

.card {
  background: rgba(255, 255, 255, 0.9);
  padding: 40px;
  border-radius: 30px;
  box-shadow: 0 10px 40px rgba(255, 105, 180, 0.2);
  text-align: center;
  max-width: 500px;
  width: 90%;
  position: relative;
  transition: all 0.3s ease;
  border: 4px solid white;
}

/* Cute GIF styling */
.gif-container img {
  width: 180px;
  height: auto;
  border-radius: 15px;
  margin-bottom: 20px;
}

h1 {
  color: #ff5f9e;
  font-family: 'Pacifico', cursive; /* Cursive title */
  font-size: 2.2rem;
  margin: 0 0 20px 0;
  line-height: 1.2;
}

.questions {
  text-align: left;
  background: #fff0f5;
  padding: 20px;
  border-radius: 20px;
  margin-bottom: 30px;
  border: 2px dashed #ffb7c5;
}

.question {
  color: #d65db1;
  font-size: 1.1rem;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.question:last-child {
  margin-bottom: 0;
}

.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap; /* Allows wrapping when button gets huge */
  min-height: 60px;
}

button {
  border: none;
  border-radius: 50px;
  padding: 15px 32px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 1.2rem;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bouncy transition */
  position: relative;
}

#yesBtn {
  background-color:  #e3349d; /* Nice bright green */
  color: white;
  box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
  z-index: 10;
}

#yesBtn:hover {
  transform: scale(1.05);
}

#noBtn {
  background-color: #ff5f9e;
  color: white;
  box-shadow: 0 5px 15px rgba(255, 95, 158, 0.4);
}

/* Success Message Area */
#success-message {
  display: none;
  animation: popIn 0.5s ease;
}

#success-message h2 {
  color: #ff5f9e;
  font-family: 'Pacifico', cursive;
  font-size: 2rem;
}

#success-message p {
  color: #888;
  font-size: 1.1rem;
}

@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  80% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}

/* Falling Hearts */
.heart {
  position: fixed;
  color: #ff2f92;
  top: -20px;
  animation: fall linear forwards;
  z-index: 9999;
}

@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); }
}

</style>
</head>
<body>

<div class="bg-heart" style="top: 10%; left: 10%;">💖</div>
<div class="bg-heart" style="top: 20%; right: 20%; animation-delay: 1s;">✨</div>
<div class="bg-heart" style="bottom: 15%; left: 15%; animation-delay: 2s;">💕</div>
<div class="bg-heart" style="bottom: 10%; right: 5%; animation-delay: 0.5s;">🌸</div>

<div class="card" id="mainCard">
  
  <div id="pre-yes">
    <div class="gif-container">
      <img src="https://media.tenor.com/y8Udb4qQeJkAAAAi/bear-please.gif" alt="Cute Bear Asking">
    </div>

    <h1>Few Questions For My Gadhiiiii!!!😎 </h1>

    <div class="questions">
      <div class="question">💖 Is Sahaj smarter than you???</div>
       <div class="question">💕 Do youu loveee him??? (He Lovess Youu tooo😘)</div>
      <div class="question">🍯 You owe him millions of hugss and kissess??</div>
      <div class="question">✨ Togetherrr foreverrr???</div>
    </div>

    <div class="buttons">
      <button id="yesBtn">Yesss🥰</button>
      <button id="noBtn">Noo 😒</button>
    </div>
  </div>

  <div id="success-message">
    <div class="gif-container">
      <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Bear Kisses">
    </div>
    <h2>Yayyy! I knew it! 🎉</h2>
    <p>Now You are stuck with me foreverrr😏 💖✨<br> And I will love you ALWAYSSS💕😘</p>
  </div>

</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const preYes = document.getElementById("pre-yes");
const successMessage = document.getElementById("success-message");

// Phrases to guilt trip the user when they click No
const noPhrases = [
  "No 😢",
  "Are you sure?",
   "Jhuthiiii",
  "Really sure?",
  "Think again! 😣",
  "Last chance!",
  "Surely not?",
  "You might regret this!",
  "Give it another thought!",
  "Are you absolutely certain?",
  "This could be a mistake!",
  "Have a heart! 💔",
  "Don't be so cold!",
  "Change of heart?",
  "Wouldn't you reconsider?",
  "Is that your final answer?",
  "You're breaking my heart ;(",
  "Plsss? 🥺"
];

let noCount = 0;
let yesFontSize = 1.2; // Initial font size in rem
let noScale = 1;

// Audio Context for cute sounds
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playCuteSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  if (type === 'no') {
    // Low pitched 'bonk'
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
  } else {
    // High pitched 'ding'
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
  }
  
  osc.type = "sine";
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.3);
}

// Logic when clicking "No"
noBtn.addEventListener("click", () => {
  playCuteSound('no');
  noCount++;
  
  // 1. Change text on the No button
  // Loop through the array or stick to the last one
  const textIndex = Math.min(noCount, noPhrases.length - 1);
  noBtn.innerText = noPhrases[textIndex];

  // 2. Make No button smaller
  noScale = Math.max(0.1, noScale - 0.15); // Don't let it disappear completely immediately
  noBtn.style.transform = `scale(${noScale})`;

  // 3. Make Yes button BIGGER
  yesFontSize += 0.8; // Increase font size
  yesBtn.style.fontSize = `${yesFontSize}rem`;
  
  // Optional: Add padding to make it physically larger too
  const currentPadding = 15 + (noCount * 5);
  yesBtn.style.padding = `${currentPadding}px ${currentPadding * 2}px`;

  // If No gets too small, just hide it to avoid layout glitch
  if (noScale < 0.2) {
    noBtn.style.display = "none";
  }
});

// Logic when clicking "Yes"
yesBtn.addEventListener("click", () => {
  playCuteSound('yes');
  
  // Confetti explosion
  createConfetti();
  createConfetti();
  
  // UI Update
  preYes.style.display = "none";
  successMessage.style.display = "block";
  
  // Start the heart rain
  setInterval(createHeart, 200);
});

// Create falling hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerText = Math.random() > 0.5 ? "💖" : "🌸"; // Mix of hearts and flowers
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 20 + "px";
  heart.style.animationDuration = Math.random() * 2 + 3 + "s";
  document.body.appendChild(heart);
  
  setTimeout(() => heart.remove(), 5000);
}

// Simple CSS confetti effect
function createConfetti() {
  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement("div");
    confetti.style.position = "fixed";
    confetti.style.left = "50%";
    confetti.style.top = "50%";
    confetti.style.width = "10px";
    confetti.style.height = "10px";
    confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
    confetti.style.transition = "all 1s ease-out";
    confetti.style.zIndex = "1000";
    
    // Random direction
    const x = (Math.random() - 0.5) * window.innerWidth;
    const y = (Math.random() - 0.5) * window.innerHeight;
    
    document.body.appendChild(confetti);
    
    // Trigger animation
    requestAnimationFrame(() => {
        confetti.style.transform = `translate(${x}px, ${y}px) rotate(${Math.random() * 720}deg)`;
        confetti.style.opacity = "0";
    });

    setTimeout(() => confetti.remove(), 1000);
  }
}
</script>

</body>
</html>
